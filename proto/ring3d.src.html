<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0907">
<title>Last Bell 3D Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0907;--ink:#f1e8d8;--mute:#a5967f;--accent:#f0b85a;--red:#c8392f;--blue:#4f86b8;--disp:'Anton',Impact,sans-serif;--ui:'Barlow Condensed','Arial Narrow',Arial,sans-serif}
:root[data-theme="light"],:root[data-theme="dark"]{--bg:#0c0907}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0907}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;pointer-events:none}
.nm{font-family:var(--disp);font-size:18px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;text-shadow:0 1px 3px #000}
.nm small{display:block;font-family:var(--ui);font-size:13px;color:var(--mute);text-transform:none;letter-spacing:0}
.nm.r{text-align:right}.nm .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 6px 2px 0;vertical-align:middle}
.bars{margin-top:5px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}.bars i{display:block;height:100%;background:var(--accent);transition:width .2s}
.nm.r .bars i{margin-left:auto}
.clock{text-align:center;font-family:var(--disp);font-size:24px;line-height:1;text-shadow:0 1px 3px #000}.clock small{display:block;font-family:var(--ui);font-size:13px;color:var(--mute)}
.ctl{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctl button{font:700 16px var(--ui);color:var(--ink);background:rgba(20,15,11,.78);border:1.5px solid rgba(240,184,90,.45);border-radius:6px;padding:10px 14px;min-width:84px;backdrop-filter:blur(4px)}
.ctl button:active{background:rgba(240,184,90,.25)}
.big{position:fixed;left:16px;right:16px;top:38%;text-align:center;font-family:var(--disp);font-size:clamp(34px,11vw,64px);letter-spacing:.03em;color:var(--accent);text-shadow:0 3px 14px #000;opacity:0;transition:opacity .25s;pointer-events:none;text-transform:uppercase}
.big small{display:block;font-family:var(--ui);font-size:18px;color:var(--ink);letter-spacing:0;text-transform:none}
.big.on{opacity:1}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);text-align:center;font-size:14px;color:var(--mute);pointer-events:none;transition:opacity .6s}
.err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:18px}
</style></head><body>
<canvas id="c" aria-label="3D boxing ring with two fighters"></canvas>
<div class="hud">
  <div class="nm" id="n0"></div>
  <div class="clock"><span id="ck">3:00</span><small id="rd">Round 1</small></div>
  <div class="nm r" id="n1"></div>
</div>
<div class="big" id="big"></div>
<div class="hint" id="hint">Drag to move the camera</div>
<div class="ctl"><button id="bCam">Cam: TV</button><button id="bSpd">Speed 1x</button><button id="bNew">New fight</button></div>
<div class="err" id="err">This test needs WebGL. Try another browser.</div>
<script>
/*@ENGINE@*/
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';

/* ================= scene ================= */
const cv = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0907);
scene.fog = new THREE.Fog(0x0c0907, 700, 1500);
const camera = new THREE.PerspectiveCamera(34, 1, 5, 4000);

scene.add(new THREE.HemisphereLight(0xfff0dc, 0x20160f, .75));
const key = new THREE.SpotLight(0xfff1de, 3.2, 0, .62, .55, 0);
key.position.set(0, 620, 80); key.target.position.set(0, 0, 0);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.camera.near = 300; key.shadow.camera.far = 900; key.shadow.bias = -.0004; key.shadow.radius = 3;
scene.add(key, key.target);
const rimW = new THREE.DirectionalLight(0xffc98a, .55); rimW.position.set(-500, 220, -300); scene.add(rimW);
const rimC = new THREE.DirectionalLight(0x8fb3ff, .35); rimC.position.set(500, 160, -200); scene.add(rimC);
const fill = new THREE.DirectionalLight(0xfff4e6, .35); fill.position.set(0, 200, 600); scene.add(fill);

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0), Y = V(0, 1, 0);
const std = (c, r, extra) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: r == null ? .6 : r, metalness: 0 }, extra || {}));
function shade(m) { m.castShadow = true; m.receiveShadow = true; return m; }

/* ---------- helpers ---------- */
const _d = new THREE.Vector3();
function placeSeg(m, a, b) { _d.subVectors(b, a); const L = _d.length() || 1e-4; m.position.addVectors(a, b).multiplyScalar(.5); m.quaternion.setFromUnitVectors(Y, _d.multiplyScalar(1 / L)); m.scale.set(1, L, 1); }
const _m4 = new THREE.Matrix4(), _x = new THREE.Vector3(), _y = new THREE.Vector3(), _z = new THREE.Vector3();
// orient an object so local +Y = up, +Z = fwd (orthogonalized), +X = up x fwd
function orient(o, up, fwd) {
  _y.copy(up).normalize(); _z.copy(fwd).addScaledVector(_y, -fwd.dot(_y)); if (_z.lengthSq() < 1e-6) _z.set(0, 0, 1); _z.normalize();
  _x.crossVectors(_y, _z); _m4.makeBasis(_x, _y, _z); o.quaternion.setFromRotationMatrix(_m4);
}
// two-bone IK: root S, target T, lengths a/b, pole hint. Returns [joint, reachedTarget]
function ik(S, T, a, b, pole) {
  const d = T.clone().sub(S); let L = d.length(); const dn = d.clone().multiplyScalar(1 / (L || 1));
  L = clamp(L, Math.abs(a - b) + .5, a + b - .05);
  const T2 = S.clone().addScaledVector(dn, L);
  const x = (a * a + L * L - b * b) / (2 * L), h = Math.sqrt(Math.max(0, a * a - x * x));
  const p = pole.clone().addScaledVector(dn, -pole.dot(dn)); if (p.lengthSq() < 1e-6) p.set(0, -1, 0); p.normalize();
  return [S.clone().addScaledVector(dn, x).addScaledVector(p, h), T2];
}
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const outC = t => 1 - Math.pow(1 - t, 3);
const damp = (a, b, r, dt) => a + (b - a) * (1 - Math.exp(-r * dt));
const dampV = (a, b, r, dt) => a.lerp(b, 1 - Math.exp(-r * dt));
const gearC = (k, id) => (GEAR[k].find(g => g.id === id) || GEAR[k][0]);

/* ---------- ring ---------- */
const RX = RING + 14, RZ = ZR + 14, PX = RX + 4, PZ = RZ + 4, APRON = 26;
function canvasTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
  g.fillStyle = '#d8cdb9'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '60,40,20' : '255,250,240'},${Math.random() * .05})`; g.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2); }
  g.strokeStyle = 'rgba(120,40,30,.18)'; g.lineWidth = 10; g.beginPath(); g.arc(512, 512, 170, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(130,40,30,.22)'; g.font = '120px Anton, Impact, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('LAST BELL', 512, 520);
  g.strokeStyle = 'rgba(60,40,25,.12)'; g.lineWidth = 6; g.strokeRect(30, 30, 964, 964);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const ring = new THREE.Group(); scene.add(ring);
{
  const W = 2 * (PX + APRON), D = 2 * (PZ + APRON);
  const top = new THREE.Mesh(new THREE.PlaneGeometry(W, D), std(0xffffff, .92, { map: canvasTexture() }));
  top.rotation.x = -Math.PI / 2; top.receiveShadow = true; ring.add(top);
  const skirt = new THREE.Mesh(new THREE.BoxGeometry(W, 34, D), std(0x1b2235, .8)); skirt.position.y = -17.2; ring.add(skirt);
  const band = new THREE.Mesh(new THREE.BoxGeometry(W + .5, 3, D + .5), std(0xb07a2a, .5)); band.position.y = -3; ring.add(band);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), std(0x15100c, 1)); floor.rotation.x = -Math.PI / 2; floor.position.y = -34; floor.receiveShadow = true; scene.add(floor);
  const postM = std(0x2a2a2e, .35, { metalness: .6 });
  const corners = [[-1, -1, 0xb8302a], [1, 1, 0x2f62a8], [1, -1, 0xe8e2d6], [-1, 1, 0xe8e2d6]];
  for (const [sx, sz, pc] of corners) {
    const p = shade(new THREE.Mesh(new THREE.CylinderGeometry(2.6, 3, 70, 12), postM)); p.position.set(sx * PX, 35, sz * PZ); ring.add(p);
    const pad = shade(new THREE.Mesh(new THREE.BoxGeometry(9, 44, 9), std(pc, .55))); pad.position.set(sx * (PX - 4), 38, sz * (PZ - 4)); pad.rotation.y = Math.PI / 4; ring.add(pad);
  }
  const ropeCols = [0x2f62a8, 0xece6da, 0xb8302a];
  [22, 40, 58].forEach((h, i) => {
    const m = std(ropeCols[i], .45);
    const segR = (a, b) => { const r = shade(new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 1, 10), m)); placeSeg(r, a, b); ring.add(r); };
    segR(V(-PX, h, -PZ), V(PX, h, -PZ)); segR(V(-PX, h, PZ), V(PX, h, PZ)); segR(V(-PX, h, -PZ), V(-PX, h, PZ)); segR(V(PX, h, -PZ), V(PX, h, PZ));
  });
  // a lighting truss overhead and a few distant arena lights so the ring doesn't float in black
  const truss = new THREE.Mesh(new THREE.BoxGeometry(2 * PX + 80, 6, 2 * PZ + 80), std(0x111111, .8)); truss.position.y = 430; scene.add(truss);
  const lm = new THREE.MeshBasicMaterial({ color: 0xffe3b0 });
  for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2, r = 900 + (i % 3) * 60; const b = new THREE.Mesh(new THREE.SphereGeometry(5 + (i % 2) * 2, 8, 6), lm); b.position.set(Math.cos(a) * r, 120 + (i % 4) * 70, Math.sin(a) * r); scene.add(b); }
}
// corner stools (shown between rounds)
function mkStool() {
  const g = new THREE.Group(), m = std(0x6b4a2e, .6), lm = std(0x2a2a2e, .4, { metalness: .5 });
  const seat = shade(new THREE.Mesh(new THREE.CylinderGeometry(9, 9, 3, 16), m)); seat.position.y = 26; g.add(seat);
  for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI * 2; const l = shade(new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 6), lm)); placeSeg(l, V(Math.cos(a) * 7, 25, Math.sin(a) * 7), V(Math.cos(a) * 9, 0, Math.sin(a) * 9)); g.add(l); }
  g.visible = false; scene.add(g); return g;
}

/* ================= the fighter ================= */
const GUARD3 = { // glove spots in (forward, height, toward lead side), crouch, blade angle (deg), forward lean, elbow tuck
  standard: { L: [23, 80, 4], R: [12, 82, -5], c: 3, bl: 32, lean: 3, tuck: .35 },
  high:     { L: [15, 89, 4], R: [12, 89, -4], c: 4, bl: 26, lean: 3, tuck: .9 },
  peekaboo: { L: [12, 85, 4], R: [11, 85, -4], c: 8, bl: 16, lean: 7, tuck: .95 },
  philly:   { L: [9, 60, -3], R: [9, 86, -7], c: 2, bl: 52, lean: 1, tuck: .5 },
  cross:    { L: [13, 85, -5], R: [14, 78, 5], c: 5, bl: 22, lean: 4, tuck: .8 },
  handslow: { L: [22, 57, 7], R: [12, 70, -4], c: 1, bl: 36, lean: -1, tuck: .2 }
};
class Boxer {
  constructor(look, side) {
    this.side = side; this.look = look;
    this.hs = (look.h || 1) * 1.04; this.G = Math.pow(look.build || 1, 1.5) * .95 + .05;
    const G = this.G, hs = this.hs;
    const skin = std(look.skin, .62), tr = gearC('trunks', look.trunks), gl = gearC('gloves', look.gloves), sh = gearC('shoes', look.shoes);
    const trunkM = std(tr.c, .42), trimM = std(tr.trim || '#ddd', .5), gloveM = std(gl.c, .28), cuffM = std(gl.trim || '#eee', .45), bootM = std(sh.c, .5), hairM = std(look.hairCol, .85);
    const g = this.g = new THREE.Group(); scene.add(g);
    const add = (geo, m) => { const o = shade(new THREE.Mesh(geo, m)); g.add(o); return o; };
    const cyl = (r1, r2, m, seg) => add(new THREE.CylinderGeometry(r1, r2, 1, seg || 14), m); // r1 at the far end (b), r2 at a
    const ball = (r, m) => add(new THREE.SphereGeometry(r, 16, 12), m);
    // torso: a lathe from the waist (y=0) to the neck (y=1), chest flaring wide at the lats/pecs
    const prof = [[.01, 0], [.6, 0], [.62, .14], [.6, .32], [.7, .55], [.9, .75], [1, .85], [.88, .93], [.42, 1]].map(([r, y]) => new THREE.Vector2(r, y));
    this.torso = new THREE.Group(); g.add(this.torso);
    const tm = shade(new THREE.Mesh(new THREE.LatheGeometry(prof, 22), skin)); tm.scale.set(13 * G, 1, 13 * G * .62); this.torso.add(tm); this.torsoMesh = tm;
    for (const s of [-1, 1]) { const pec = shade(new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), skin)); pec.scale.set(5.4 * G, 3.9 * G, 2.4 * G); pec.position.set(s * 4.6 * G, .76, 5.6 * G); this.torso.add(pec); (this.pecs = this.pecs || []).push(pec); }
    const abs = shade(new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), skin)); abs.scale.set(5.6 * G, 9 * G, 2 * G); abs.position.set(0, .4, 4.6 * G); this.torso.add(abs); this.abs = abs;
    // trunks: a lathe around the hips, with a waistband
    const tp = [[.01, -.02], [.9, 0], [1, .35], [.98, .78], [.92, 1]].map(([r, y]) => new THREE.Vector2(r, y));
    this.trunks = new THREE.Group(); g.add(this.trunks);
    const tk = shade(new THREE.Mesh(new THREE.LatheGeometry(tp, 22), trunkM)); tk.scale.set(12.2 * G, 15 * hs, 12.2 * G * .78); tk.position.y = -9 * hs; this.trunks.add(tk);
    const wb = shade(new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 22, 1, true), trimM)); wb.scale.set(11.6 * G, 3.2, 11.6 * G * .78); wb.position.y = 5.2 * hs; this.trunks.add(wb);
    this.legSleeve = [cyl(7.3 * G, 7.9 * G, trunkM), cyl(7.3 * G, 7.9 * G, trunkM)];
    this.thigh = [cyl(4.8 * G, 7 * G, skin), cyl(4.8 * G, 7 * G, skin)];
    this.knee = [ball(4.7 * G, skin), ball(4.7 * G, skin)];
    this.shin = [cyl(3.3 * G, 4.6 * G, skin), cyl(3.3 * G, 4.6 * G, skin)];
    this.calf = [ball(1, skin), ball(1, skin)];
    this.bootShaft = [cyl(4.1 * G, 4.4 * G, bootM), cyl(4.1 * G, 4.4 * G, bootM)];
    this.foot = [0, 1].map(() => { const f = shade(new THREE.Mesh(new THREE.CapsuleGeometry(3.6 * G, 8.5, 6, 12), bootM)); g.add(f); return f; });
    this.sole = [0, 1].map(() => { const f = shade(new THREE.Mesh(new THREE.BoxGeometry(7.4 * G, 1.2, 15.5), std(0xe8e2d6, .7))); g.add(f); return f; });
    this.delt = [ball(5.5 * G, skin), ball(5.5 * G, skin)];
    this.trap = shade(new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), skin)); g.add(this.trap);
    this.upper = [cyl(3.8 * G, 5 * G, skin), cyl(3.8 * G, 5 * G, skin)];
    this.bicep = [ball(1, skin), ball(1, skin)];
    this.elbowB = [ball(3.7 * G, skin), ball(3.7 * G, skin)];
    this.fore = [cyl(3.1 * G, 4 * G, skin), cyl(3.1 * G, 4 * G, skin)];
    this.glove = [0, 1].map(() => {
      const o = new THREE.Group(); g.add(o);
      const m = shade(new THREE.Mesh(new THREE.SphereGeometry(6.4, 18, 14), gloveM)); m.scale.set(1, .92, 1.22); m.position.z = 6.5; o.add(m);
      const th = shade(new THREE.Mesh(new THREE.CapsuleGeometry(1.9, 4, 4, 8), gloveM)); th.position.set(4.6, 2.4, 6); th.rotation.x = Math.PI / 2.4; th.rotation.z = -.4; o.add(th); o.thumb = th;
      const cuff = shade(new THREE.Mesh(new THREE.CylinderGeometry(4.4, 4.2, 6.5, 14), gloveM)); cuff.rotation.x = Math.PI / 2; cuff.position.z = 0; o.add(cuff);
      const tr = shade(new THREE.Mesh(new THREE.CylinderGeometry(4.55, 4.55, 1.6, 14), cuffM)); tr.rotation.x = Math.PI / 2; tr.position.z = -1.8; o.add(tr);
      return o;
    });
    this.neck = cyl(4.8 * G, 5.6 * G, skin);
    // head, built facing +Z
    const hd = this.head = new THREE.Group(); g.add(hd);
    const skull = shade(new THREE.Mesh(new THREE.SphereGeometry(8.4, 24, 18), skin)); skull.scale.set(.86, 1.06, .98); hd.add(skull);
    const jaw = shade(new THREE.Mesh(new THREE.SphereGeometry(6.4, 18, 12), skin)); jaw.scale.set(.95, .78, 1); jaw.position.set(0, -4.4, 2.4); hd.add(jaw);
    const nose = shade(new THREE.Mesh(new THREE.SphereGeometry(1.5, 10, 8), skin)); nose.scale.set(.85, 1.15, 1.1); nose.position.set(0, -1.2, 7.9); hd.add(nose);
    const eyeM = new THREE.MeshStandardMaterial({ color: 0x1a120c, roughness: .3 }), browM = std(look.hairCol, .9);
    for (const s of [-1, 1]) {
      const e = new THREE.Mesh(new THREE.SphereGeometry(1.05, 10, 8), eyeM); e.position.set(s * 2.9, 1.2, 7.4); hd.add(e);
      const br = new THREE.Mesh(new THREE.BoxGeometry(3.6, .9, 1.2), browM); br.position.set(s * 2.9, 3, 7.7); br.rotation.z = s * -.12; hd.add(br);
      const ear = shade(new THREE.Mesh(new THREE.SphereGeometry(1.7, 10, 8), skin)); ear.scale.set(.5, 1, .8); ear.position.set(s * 7.2, 0, .4); hd.add(ear);
    }
    if (look.hair !== 'bald') {
      const kind = look.hair, cap = new THREE.Mesh(new THREE.SphereGeometry(8.55, 22, 14, 0, Math.PI * 2, 0, kind === 'fade' || kind === 'buzz' ? Math.PI * .4 : Math.PI * .5), hairM);
      cap.scale.set(.89, kind === 'afro' ? 1.22 : 1.08, 1.01); cap.position.set(0, kind === 'afro' ? 1.2 : .25, -.5); cap.rotation.x = -.3; cap.castShadow = true; hd.add(cap);
    }
    if (look.beard) { const bd = new THREE.Mesh(new THREE.SphereGeometry(6.8, 18, 12, 0, Math.PI * 2, Math.PI * .45, Math.PI * .5), hairM); bd.scale.set(.96, .9, 1.05); bd.position.set(0, -3.6, 2.6); hd.add(bd); }
    this.stool = mkStool();
    this.sm = null; this.t = Math.random() * 10; this.heading = side ? Math.PI : 0;
  }
  // build this frame's joint positions from the engine snapshot, then place every mesh
  pose(s, op, opB, dt, cornerPt) {
    const G = this.G, hs = this.hs, gd = GUARD3[s.guard] || GUARD3.standard; this.t += dt;
    const pos = V(s.x, 0, s.z);
    // facing: at the other man, or where he's walking
    if (!this.prev) this.prev = pos.clone();
    const vel = pos.clone().sub(this.prev).multiplyScalar(1 / Math.max(dt, 1e-3)); this.prev.copy(pos);
    let want;
    if (s.sit) want = Math.atan2(-s.x, -s.z);
    else if (s.walk && vel.length() > 12) want = Math.atan2(vel.x, vel.z);
    else want = Math.atan2(op.x - s.x, op.z - s.z);
    let dh = want - this.heading; while (dh > Math.PI) dh -= Math.PI * 2; while (dh < -Math.PI) dh += Math.PI * 2;
    this.heading += dh * (1 - Math.exp(-(s.walk ? 6 : 14) * dt));
    const fwd = V(Math.sin(this.heading), 0, Math.cos(this.heading)), left = V(fwd.z, 0, -fwd.x); // up x fwd
    const lead = s.stance === 'southpaw' ? left.clone().negate() : left.clone();
    const P = (f, u, l, base) => (base || pos).clone().addScaledVector(fwd, f).addScaledVector(UP, u * hs).addScaledVector(lead, l);
