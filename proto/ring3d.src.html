<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Last Bell 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

.nm.r .bars i{margin-left:auto}

.ctl button:active{background:rgba(240,184,90,.25)}

</style></head><body>
<canvas id="c" aria-label="3D boxing ring with two fighters"></canvas>
<div class="hud">
  <div class="nm" id="n0"></div>
  <div class="clock"><span id="ck">3:00</span><small id="rd">Round 1</small></div>
  <div class="nm r" id="n1"></div>
</div>
<div class="big" id="big"></div>
<div class="hint" id="hint">Drag to move the camera</div>
<div class="ctl"><button id="bCam">Cam: TV</button><button id="bSpd">Speed 1x</button><button id="bNew">New fight</button><button id="bStand">Stand</button><button id="bGray">Gray</button><button id="bPerf">Phone test</button></div>
<div class="perf" id="perf" aria-live="polite"></div>
<div class="err" id="err">This test needs WebGL. Try another browser.</div>
<script>
/*@ENGINE@*/
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';

/* ================= scene ================= */
const cv = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0806);
scene.fog = new THREE.Fog(0x0b0806, 650, 1500);
const camera = new THREE.PerspectiveCamera(34, 1, 5, 4000);

// cel lighting: one hot key over the ring (the shadows), a soft fill, warm and cold rims. The crowd sits in the dark
scene.add(new THREE.HemisphereLight(0xfff0dc, 0x2a2018, 1.1));
const key = new THREE.SpotLight(0xfff1de, 2.6, 0, .66, .5, 0);
key.position.set(40, 640, 160); key.target.position.set(0, 0, 0);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.camera.near = 300; key.shadow.camera.far = 900; key.shadow.bias = -.0005; key.shadow.normalBias = .6; key.shadow.radius = 2;
scene.add(key, key.target);
const rimW = new THREE.DirectionalLight(0xffc98a, .7); rimW.position.set(-500, 220, -300); scene.add(rimW);
const rimC = new THREE.DirectionalLight(0x8fb3ff, .5); rimC.position.set(500, 160, -200); scene.add(rimC);
const fill = new THREE.DirectionalLight(0xfff4e6, .55); fill.position.set(0, 200, 600); scene.add(fill);

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0), Y = V(0, 1, 0);
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const outC = t => 1 - Math.pow(1 - t, 3);
const damp = (a, b, r, dt) => a + (b - a) * (1 - Math.exp(-r * dt));
const dampV = (a, b, r, dt) => a.lerp(b, 1 - Math.exp(-r * dt));
const _d = new THREE.Vector3();
function placeSeg(m, a, b) { _d.subVectors(b, a); const L = _d.length() || 1e-4; m.position.addVectors(a, b).multiplyScalar(.5); m.quaternion.setFromUnitVectors(Y, _d.multiplyScalar(1 / L)); m.scale.set(1, L, 1); }
function shade(m) { m.castShadow = true; m.receiveShadow = true; return m; }

/*@BOXER@*/

const toon = (c, extra) => toonMat(Object.assign({ color: c }, extra || {}));
const gearC = (k, id) => (GEAR[k].find(g => g.id === id) || GEAR[k][0]);

/* ---------- ring ---------- */
const RX = RING + 14, RZ = ZR + 14, PX = RX + 4, PZ = RZ + 4, APRON = 26;
function canvasTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
  g.fillStyle = '#ddd2be'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 6000; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '60,40,20' : '255,250,240'},${Math.random() * .04})`; g.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2); }
  g.strokeStyle = 'rgba(120,40,30,.2)'; g.lineWidth = 12; g.beginPath(); g.arc(512, 512, 170, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(130,40,30,.24)'; g.font = '120px Anton, Impact, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('LAST BELL', 512, 520);
  g.strokeStyle = 'rgba(60,40,25,.14)'; g.lineWidth = 6; g.strokeRect(30, 30, 964, 964);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const ring = new THREE.Group(); scene.add(ring);
const lineM = new THREE.MeshBasicMaterial({ color: 0x140d09, side: THREE.BackSide });
{
  const W = 2 * (PX + APRON), D = 2 * (PZ + APRON);
  const top = new THREE.Mesh(new THREE.PlaneGeometry(W, D), toon(0xffffff, { map: canvasTexture() }));
  top.rotation.x = -Math.PI / 2; top.receiveShadow = true; ring.add(top);
  const skirt = new THREE.Mesh(new THREE.BoxGeometry(W, 34, D), toon(0x1b2235)); skirt.position.y = -17.2; ring.add(skirt);
  const band = new THREE.Mesh(new THREE.BoxGeometry(W + .5, 3, D + .5), toon(0xb07a2a)); band.position.y = -3; ring.add(band);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), toon(0x15100c)); floor.rotation.x = -Math.PI / 2; floor.position.y = -34; floor.receiveShadow = true; scene.add(floor);
  const postM = toon(0x2a2a2e);
  const corners = [[-1, -1, 0xb8302a], [1, 1, 0x2f62a8], [1, -1, 0xe8e2d6], [-1, 1, 0xe8e2d6]];
  for (const [sx, sz, pc] of corners) {
    const p = shade(new THREE.Mesh(new THREE.CylinderGeometry(2.6, 3, 70, 12), postM)); p.position.set(sx * PX, 35, sz * PZ); ring.add(p);
    const pad = shade(new THREE.Mesh(new THREE.BoxGeometry(9, 44, 9), toon(pc))); pad.position.set(sx * (PX - 4), 38, sz * (PZ - 4)); pad.rotation.y = Math.PI / 4; ring.add(pad);
  }
  // ropes: one merged mesh per color (3 draw calls), dark outline hulls behind
  const ropeCols = [0x2f62a8, 0xece6da, 0xb8302a];
  [22, 40, 58].forEach((h, i) => {
    const segs = [[V(-PX, h, -PZ), V(PX, h, -PZ)], [V(-PX, h, PZ), V(PX, h, PZ)], [V(-PX, h, -PZ), V(-PX, h, PZ)], [V(PX, h, -PZ), V(PX, h, PZ)]];
    const geos = segs.map(([a, b]) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 1, 10)); placeSeg(m, a, b); m.updateMatrix(); return m.geometry.clone().applyMatrix4(m.matrix); });
    const all = new THREE.BufferGeometry(), P = [], N = [], I = []; let o = 0;
    for (const g of geos) { const pa = g.attributes.position, na = g.attributes.normal; for (let k = 0; k < pa.count; k++) { P.push(pa.getX(k), pa.getY(k), pa.getZ(k)); N.push(na.getX(k), na.getY(k), na.getZ(k)); } for (let k = 0; k < g.index.count; k++) I.push(g.index.getX(k) + o); o += pa.count; }
    all.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); all.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3)); all.setIndex(I);
    ring.add(shade(new THREE.Mesh(all, toon(ropeCols[i]))));
  });
  // a lighting truss overhead and a few distant arena lights so the ring doesn't float in black
  const truss = new THREE.Mesh(new THREE.BoxGeometry(2 * PX + 80, 6, 2 * PZ + 80), toon(0x111111)); truss.position.y = 430; scene.add(truss);
  const lights = new THREE.InstancedMesh(new THREE.SphereGeometry(6, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffe3b0 }), 40), m4 = new THREE.Matrix4();
  for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2, r = 900 + (i % 3) * 60; m4.makeTranslation(Math.cos(a) * r, 120 + (i % 4) * 70, Math.sin(a) * r); lights.setMatrixAt(i, m4); }
  scene.add(lights);
}
// the crowd: dark silhouettes in rising rows around the ring, one instanced mesh; they bob with the action
const CROWD = (() => {
  const body = new THREE.CapsuleGeometry(10, 18, 2, 6).translate(0, 20, 0), head = new THREE.SphereGeometry(6.5, 6, 4).translate(0, 44, 0);
  const geo = new THREE.BufferGeometry(); { const P = [], I = []; let o = 0; for (const g of [body, head]) { const pa = g.attributes.position; for (let k = 0; k < pa.count; k++) P.push(pa.getX(k), pa.getY(k), pa.getZ(k)); for (let k = 0; k < g.index.count; k++) I.push(g.index.getX(k) + o); o += pa.count; } geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); geo.setIndex(I); }
  const n = 360, m = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff }), n), base = [], m4 = new THREE.Matrix4(), c = new THREE.Color();
  let i = 0;
  for (let row = 0; row < 5 && i < n; row++) {
    const ex = PX + APRON + 70 + row * 34, ez = PZ + APRON + 70 + row * 34, per = 2 * (ex + ez) / 22;
    for (let k = 0; k < per && i < n; k++) {
      const L = 4 * ex + 4 * ez; let u = (k + Math.random() * .5) / per * L, x, z;
      if (u < 2 * ex) { x = -ex + u; z = -ez; } else if ((u -= 2 * ex) < 2 * ez) { x = ex; z = -ez + u; } else if ((u -= 2 * ez) < 2 * ex) { x = ex - u; z = ez; } else { u -= 2 * ex; x = -ex; z = ez - u; }
      x += (Math.random() - .5) * 10; z += (Math.random() - .5) * 10;
      base.push({ x, y: -34 + row * 16, z, ph: Math.random() * 7, s: .85 + Math.random() * .3 });
      c.setHSL(.06 + Math.random() * .08, .35, .006 + Math.random() * .012 + row * .0015); m.setColorAt(i, c); i++;
    }
  }
  m.count = i; scene.add(m);
  let t = 0;
  return { tick(dt, ex) { t += dt; for (let j = 0; j < m.count; j++) { const b = base[j], hop = Math.max(0, Math.sin(t * (3 + ex * 5) + b.ph)) * (1 + ex * 9); m4.makeScale(b.s, b.s, b.s).setPosition(b.x, b.y + hop, b.z); m.setMatrixAt(j, m4); } m.instanceMatrix.needsUpdate = true; } };
})();
// corner stools (shown between rounds)
function mkStool() {
  const g = new THREE.Group(), m = toon(0x6b4a2e), lm = toon(0x2a2a2e);
  const seat = shade(new THREE.Mesh(new THREE.CylinderGeometry(9, 9, 3, 16), m)); seat.position.y = 26; g.add(seat);
  for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI * 2; const l = shade(new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 6), lm)); placeSeg(l, V(Math.cos(a) * 7, 25, Math.sin(a) * 7), V(Math.cos(a) * 9, 0, Math.sin(a) * 9)); g.add(l); }
  g.visible = false; scene.add(g); return g;
}
const stools = [mkStool(), mkStool()];

/* ================= the referee: the same skeleton and motion, his own kit and job ================= */
GUARD3D.ref = { tL: [12, -40, 8], tR: [12, -40, -8], lL: [12, -40, 8], lR: [12, -40, -8], c: 1, bl: 0, lean: 2, tuck: .5 };
RHY.ref = { b: 0, bf: 1, toe: 0, sw: .6, sf: .35, bob: 0, head: .5 };
class Ref {
  constructor() {
    this.b = new Boxer3(scene, { ref: true, skin: '#c89a78', hair: 'bald', hairCol: '#8a8580', shirt: '#e9e6df', pants: '#18181c' }, { h: 1, arm: 1, build: .98 });
    this.x = 0; this.z = -60; this.side = 1; this.sideT = 4; this.t = 0; this.mode = 'watch';
  }
  update(dt, F, B, snap, P) {
    this.t += dt;
    const A = P[0], Bs = P[1], mx = (A.x + Bs.x) / 2, mz = (A.z + Bs.z) / 2;
    const ax = Bs.x - A.x, az = Bs.z - A.z, L = Math.hypot(ax, az) || 1, px = -az / L, pz = ax / L; // perpendicular to their line
    // the side farther from the camera, so he never stands in front of the action (with a little stickiness)
    const camS = (camera.position.x - mx) * px + (camera.position.z - mz) * pz > 0 ? -1 : 1;
    this.sideT -= dt; if (camS !== this.side && this.sideT <= 0) { this.side = camS; this.sideT = 2.5; }
    let tx, tz, sp = 120, look = V(mx, 80, mz), mode = 'watch';
    const K = F.kdState;
    if (F.phase === 'kd' && K && B[K.who].col) {
      // beside the man on the floor, on the side away from the camera
      const bx = B[K.who], c = bx.J[BI.Spine2], hx = Math.sin(bx.heading), hz = Math.cos(bx.heading), lx = hz, lz = -hx;
      const cs = (camera.position.x - c.x) * lx + (camera.position.z - c.z) * lz > 0 ? -1 : 1;
      const rr = snap.f[K.who].rise ? 40 : 32; tx = c.x + lx * cs * rr - hx * 8; tz = c.z + lz * cs * rr - hz * 8; sp = 160; look = V(c.x, 20, c.z); mode = 'count';
      this.count = K.count; this.pulse = clamp(K.tick / .95, 0, 1);
    } else if (F.phase === 'over' && F.result && !F.result.decision && (this.overT = (this.overT || 0) + dt) < 4) {
      const D = P[1 - F.result.winner];
      tx = D.x + px * this.side * 32; tz = D.z + pz * this.side * 32; sp = 170; look = V(D.x, 60, D.z); mode = 'wave';
    } else if (F.phase === 'fight' && (F.clinchT > 0 || snap.f[0].state === 'clinch')) {
      tx = mx + px * camS * 24; tz = mz + pz * camS * 24; sp = 140; mode = 'break'; // always steps in from behind them
    } else if (F.phase !== 'fight') {
      tx = RING * .55; tz = -ZR * .62; sp = 60; look = V(0, 70, 0);
    } else {
      // a spot off to one side of the pair (never between them or in front), far from both, inside the ropes
      this.pickT = (this.pickT || 0) - dt;
      if (this.pickT <= 0 || this.tx == null) {
        this.pickT = .5;
        const scr = (x, z) => V(x, 80, z).project(camera);
        const fs = [scr(A.x, A.z), scr(Bs.x, Bs.z)], lo = Math.min(fs[0].x, fs[1].x) - .22, hi = Math.max(fs[0].x, fs[1].x) + .22;
        const score = (x, z) => {
          let sc = 0; const v = scr(x, z);
          if (v.x > lo && v.x < hi) sc += 6 * Math.min(v.x - lo, hi - v.x);
          for (const f of [A, Bs]) sc += Math.max(0, 75 - Math.hypot(x - f.x, z - f.z)) * .05;
          const camD = (camera.position.x - mx) * (x - mx) + (camera.position.z - mz) * (z - mz); if (camD > 0) sc += 2;
          sc += Math.max(0, Math.abs(x) - (RING - 14)) * .2 + Math.max(0, Math.abs(z) - (ZR - 14)) * .2;
          return sc;
        };
        let best = null;
        for (let a = 0; a < 16; a++) for (const r of [85, 110, 135]) {
          const th = a / 16 * Math.PI * 2, x = clamp(mx + Math.cos(th) * r, -RING + 10, RING - 10), z = clamp(mz + Math.sin(th) * r, -ZR + 10, ZR - 10), sc = score(x, z);
          if (!best || sc < best.sc) best = { x, z, sc };
        }
        if (this.tx == null || best.sc < score(this.tx, this.tz) - .3) { this.tx = best.x; this.tz = best.z; }
      }
      tx = this.tx; tz = this.tz; sp = 90;
    }
    if (F.phase !== 'over') this.overT = 0;
    tx = clamp(tx, -RING + 6, RING - 6); tz = clamp(tz, -ZR + 6, ZR - 6);
    const dx = tx - this.x, dz = tz - this.z, dd = Math.hypot(dx, dz);
    if (dd > 3) { const m = Math.min(dd, sp * dt) / dd; this.x += dx * m; this.z += dz * m; }
    const keep = [A, Bs].map(f => ({ x: f.x, z: f.z })); for (const bx of B) if (bx.col) keep.push({ x: bx.col.chest.x, z: bx.col.chest.z }, { x: bx.col.head.x, z: bx.col.head.z });
    for (const f of keep) { const ox = this.x - f.x, oz = this.z - f.z, od = Math.hypot(ox, oz), r = mode === 'break' ? 20 : mode === 'count' ? (K && snap.f[K.who].rise ? 34 : 26) : 30; if (od < r && od > .01) { this.x = f.x + ox / od * r; this.z = f.z + oz / od * r; } }
    this.mode = mode;
    // his hands, off his own shoulders and hips (last frame's)
    const b = this.b, J = b.J, f = b.fwd || V(0, 0, 1), lf = V(f.z, 0, -f.x), sh = [J[BI.LeftArm], J[BI.RightArm]], hip = J[BI.Hips];
    let hands;
    if (!b.col) hands = null;
    else if (mode === 'count') {
      const u = this.pulse < .25 ? 1 - this.pulse / .25 : this.pulse > .8 ? (this.pulse - .8) / .2 : 0; // chop down on each count
      hands = [hip.clone().addScaledVector(f, 12).addScaledVector(lf, 9).addScaledVector(UP, -4), sh[1].clone().addScaledVector(f, 18).addScaledVector(UP, -18 + u * 30).addScaledVector(lf, 3)];
    } else if (mode === 'wave') { const w = Math.sin(this.t * 11) * 13; hands = [sh[0].clone().addScaledVector(UP, 22).addScaledVector(lf, -6 + w).addScaledVector(f, 6), sh[1].clone().addScaledVector(UP, 22).addScaledVector(lf, 6 - w).addScaledVector(f, 6)]; }
    else if (mode === 'break' && B[0].col && B[1].col) {
