<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0907">
<title>Last Bell 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0907;--ink:#f1e8d8;--mute:#a5967f;--accent:#f0b85a;--red:#c8392f;--blue:#4f86b8;--disp:'Anton',Impact,sans-serif;--ui:'Barlow Condensed','Arial Narrow',Arial,sans-serif;color-scheme:dark} /* one dark arena look, on purpose */
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;pointer-events:none}
.nm{font-family:var(--disp);font-size:18px;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;text-shadow:0 1px 3px #000}
.nm small{display:block;font-family:var(--ui);font-size:13px;color:var(--mute);text-transform:none;letter-spacing:0}
.nm.r{text-align:right}.nm .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 6px 2px 0;vertical-align:middle}
.bars{margin-top:5px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}.bars i{display:block;height:100%;background:var(--accent);transition:width .2s}
.nm.r .bars i{margin-left:auto}
.clock{text-align:center;font-family:var(--disp);font-size:24px;line-height:1;text-shadow:0 1px 3px #000}.clock small{display:block;font-family:var(--ui);font-size:13px;color:var(--mute)}
.ctl{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctl button{font:700 16px var(--ui);color:var(--ink);background:rgba(20,15,11,.78);border:1.5px solid rgba(240,184,90,.45);border-radius:6px;padding:10px 14px;min-width:84px;backdrop-filter:blur(4px)}
.ctl button:active{background:rgba(240,184,90,.25)}
.big{position:fixed;left:16px;right:16px;top:38%;text-align:center;font-family:var(--disp);font-size:clamp(34px,11vw,64px);letter-spacing:.03em;color:var(--accent);text-shadow:0 3px 14px #000;opacity:0;transition:opacity .25s;pointer-events:none;text-transform:uppercase}

.big.on{opacity:1}

.err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:18px}
</style></head><body>
<canvas id="c" aria-label="3D boxing ring with two fighters"></canvas>
<div class="hud">
  <div class="nm" id="n0"></div>

</div>

<div class="err" id="err">This test needs WebGL. Try another browser.</div>
<script>
/* ===== LAST BELL : engine ===== */
const R = Math.random;
const rnd = (a, b) => a + R() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(R() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const gauss = () => { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
function wpick(items, wfn) {
  let tot = 0; const ws = items.map(i => { const w = Math.max(0, wfn(i)); tot += w; return w; });
  if (tot <= 0) return items[0];
  let r = R() * tot;
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}

const STATS = ['power', 'speed', 'accuracy', 'defense', 'footwork', 'chin', 'body', 'stamina', 'recovery', 'heart'];
const STAT_LABEL = { power: 'Power', speed: 'Hand speed', accuracy: 'Accuracy', defense: 'Head movement', footwork: 'Footwork', chin: 'Chin', body: 'Body toughness', stamina: 'Stamina', recovery: 'Recovery', heart: 'Heart' };
const OVR_W = { power: .12, speed: .12, accuracy: .11, defense: .12, footwork: .09, chin: .11, body: .07, stamina: .10, recovery: .06, heart: .10 };
function ovr(s) { let t = 0; for (const k of STATS) t += s[k] * OVR_W[k]; return Math.round(t); }

const PUNCH = {
  jab:      { name: 'jab',          dur: .30, dmg: 1.5, cost: 1.0, min: 36, max: 78, kind: 'straight', zone: 'head', arm: 'lead', cat: 'jab' },
  cross:    { name: 'right hand',   dur: .40, dmg: 3.6, cost: 2.2, min: 36, max: 76, kind: 'straight', zone: 'head', arm: 'rear', cat: 'power' },
  hook:     { name: 'hook',         dur: .46, dmg: 4.2, cost: 2.6, min: 22, max: 60, kind: 'hook',     zone: 'head', arm: 'lead', cat: 'power' },
  uppercut: { name: 'uppercut',     dur: .48, dmg: 4.6, cost: 2.8, min: 18, max: 54, kind: 'upper',    zone: 'head', arm: 'rear', cat: 'power' },
  bodyJab:  { name: 'jab downstairs', dur: .32, dmg: 1.4, cost: 1.0, min: 34, max: 76, kind: 'straight', zone: 'body', arm: 'lead', cat: 'body' },
  bodyHook: { name: 'body hook',    dur: .48, dmg: 3.9, cost: 2.6, min: 20, max: 58, kind: 'hook',     zone: 'body', arm: 'lead', cat: 'body' }
};
// open: waits for openings (punches less until the other guy gives him something, then fires fast)
// legs: footwork going back and sideways. stick: jabs the man walking in and stops his feet
// hit: weight behind the power shots. ramp: turns the volume up when the fight calls for it
// out: slides out on an angle when the other guy gets inside. inside: smothers you in close (no room to slip or counter)
// special-style traits: eco (cheaper punches), angle (steps off after combos, he loses you), odd (hard to read, weird timing),
// leap (lunges in from further out), swap (switches stance, resets your read), bodyX (body shots hurt more), pjab (jab on the way in),
// spoil (ties up combos, dirty work in the clutches), grab (grabs when you get close, leans), bite (feints that make you commit)
const STYLES = {
  outboxer: { label: 'Out-boxer', desc: 'Fights on the outside behind the jab. Gets out when you get close.', range: 72, ret: .95, circ: .85, cutK: .25, aggr: .82, counter: .35, feint: 1.2, clinch: .8, gen: .3, legs: 1.3, stick: .7, out: 1,
    bias: { speed: 2, footwork: 3, defense: 1, accuracy: 3, heart: 3, power: -3, chin: -1 } },
  slugger: { label: 'Slugger', desc: 'Walks you down and sits on every shot. Fewer punches, all of them heavy.', range: 58, ret: .6, circ: .2, cutK: .85, aggr: .68, counter: .2, feint: .5, clinch: 1, gen: 0, legs: .92, hit: 1.3, inside: .7,
    bias: { power: 10, chin: 7, heart: 2, speed: -2, footwork: -4, defense: -1 } },
  swarmer: { label: 'Swarmer', desc: 'Relentless. Throws all night and makes every round a war. Burns gas.', range: 54, ret: .45, circ: .3, cutK: 1.05, aggr: 1.85, counter: .25, feint: .6, clinch: 1.1, gen: 0, inside: 1.15,
    bias: { stamina: 7, heart: 4, body: 4, speed: 3, power: 4, defense: 2, footwork: -1 } },
  counter: { label: 'Counter-puncher', desc: 'Patient. Waits for you to throw, then makes you pay for it.', range: 68, ret: .9, circ: .6, cutK: .4, aggr: .48, counter: .6, feint: 1.4, clinch: .8, gen: .22, open: 1, legs: 1.08,
    bias: { defense: 4, accuracy: 6, recovery: 2, heart: 3, chin: 2, stamina: -2, power: -5 } },
  boxerpuncher: { label: 'Boxer-puncher', desc: 'A bit of everything. Boxes, then turns it up when the fight calls for it.', range: 66, ret: .8, circ: .5, cutK: .6, aggr: .8, counter: .45, feint: 1, clinch: .9, gen: .12, open: .3, ramp: .8,
    bias: { power: 3, accuracy: 3, speed: 2, footwork: 3, heart: 2 } },
  // special styles: one legend per division fights each of these. Beat him and you can learn it
  volume: { label: 'Volume puncher', special: true, desc: 'Throws in bunches, round after round. Light hands, a gas tank that never empties.', range: 62, ret: .7, circ: .55, cutK: .7, aggr: 1.7, counter: .35, feint: .6, clinch: .8, gen: .1, hit: .82, eco: .78, ramp: .3,
    bias: { stamina: 8, speed: 5, recovery: 4, power: -6, chin: -2 } },
  angle: { label: 'Angle fighter', special: true, desc: 'Hits you, then he is gone. Steps off to the side and makes you turn to find him.', range: 64, ret: .85, circ: .9, cutK: .5, aggr: .82, counter: .42, feint: 1.3, clinch: .7, gen: .25, legs: 1.1, angle: 1,
    bias: { footwork: 8, speed: 5, accuracy: 3, power: -4, chin: -3 } },
  awkward: { label: 'Awkward', special: true, desc: 'Weird rhythm, hands low, punches from places you do not see coming. Hard to figure out.', range: 66, ret: .8, circ: .7, cutK: .4, aggr: .85, counter: .4, feint: 1.6, clinch: .8, gen: .1, odd: .8, leap: 4,
    bias: { speed: 4, power: 4, defense: 3, accuracy: -4, stamina: -3 } },
  switch: { label: 'Switch-hitter', special: true, desc: 'Orthodox, southpaw, orthodox again. Every time you figure him out, he changes.', range: 64, ret: .8, circ: .55, cutK: .6, aggr: .85, counter: .45, feint: 1, clinch: .85, gen: .15, swap: 1,
    bias: { accuracy: 5, defense: 4, speed: 3, power: 1, stamina: -2 } },
  body: { label: 'Body snatcher', special: true, desc: 'Breaks you down downstairs, one rib at a time. The head comes later.', range: 56, ret: .55, circ: .35, cutK: .95, aggr: 1.2, counter: .3, feint: .7, clinch: 1, gen: 0, inside: .6, bodyX: 1,
    bias: { body: 5, power: 5, stamina: 5, heart: 4, speed: -3, footwork: -3 } },
  pboxer: { label: 'Pressure boxer', special: true, desc: 'Walks you down behind a stiff jab and cuts the ring off. No wasted punches.', range: 60, ret: .65, circ: .3, cutK: 1.25, aggr: 1.05, counter: .35, feint: .8, clinch: .9, gen: .2, pjab: 1, hit: 1.18,
    bias: { power: 6, chin: 5, stamina: 4, footwork: 2, speed: -3, defense: -3 } },
  spoiler: { label: 'Veteran spoiler', special: true, desc: 'Old tricks. Ties you up, leans on you, sneaks shots in the clutches. Ugly and smart.', range: 64, ret: .85, circ: .45, cutK: .5, aggr: .7, counter: .5, feint: 1.2, clinch: 1.6, gen: .3, open: .5, spoil: 1,
    bias: { defense: 6, accuracy: 5, recovery: 4, heart: 2, speed: -4, stamina: -2 } },
  jabgrab: { label: 'Jab-and-grab', special: true, desc: 'Long jab, and the second you get close he grabs you and leans his weight on you.', range: 74, ret: .95, circ: .6, cutK: .35, aggr: .9, counter: .3, feint: .8, clinch: 1.4, gen: .35, legs: 1.1, stick: 1, grab: 1, hit: 1.15,
    bias: { power: 6, accuracy: 4, footwork: 2, chin: -2, speed: -2, heart: -2 } },
  feinter: { label: 'Feint master', special: true, desc: 'Feints you into knots, then hits whatever you leave open.', range: 64, ret: .85, circ: .7, cutK: .6, aggr: .92, counter: .45, feint: 2.6, clinch: .8, gen: .4, legs: 1.1, bite: 1,
    bias: { speed: 4, accuracy: 4, footwork: 4, defense: 2, power: -3 } }
};
const BASE_STYLES = Object.keys(STYLES).filter(k => !STYLES[k].special);

/* ---------- guards: how a fighter holds his hands. Picked at creation, fixed for the career ----------
   head/body: passive block strength by zone. str/hook/up: block strength by punch type.
   ev: head-movement evasion. ctr: counter chance. hold: how long the guard holds up under fire.
   def: weights for which reactive defense he reaches for. skill: stats that make the guard work. */
const GUARDS = {
  standard: { label: 'Standard', desc: 'Lead hand out, rear hand home by the chin. No big holes, no big edges.',
    head: 1, body: 1, str: 1, hook: 1, up: 1, ev: 1, ctr: 1, hold: 1, def: { block: 1, slip: 1, duck: 1, pull: 1 } },
  high: { label: 'High guard', desc: 'Gloves glued to the temples, elbows tight. Hard to crack upstairs, but the body is open and he sees less.',
    head: 1.15, body: .75, str: 1.15, hook: 1.2, up: .75, ev: .82, ctr: .85, hold: 1.1, def: { block: 2, slip: .6, duck: .7, pull: .6 } },
  peekaboo: { label: 'Peek-a-boo', desc: 'Fists on the cheekbones, head always moving. Slips and rolls his way inside. Needs quick reflexes.',
    head: 1, body: .7, str: 1, hook: 1.05, up: .8, ev: .98, ctr: 1, hold: 1, skill: ['defense', 'speed'], def: { block: 1, slip: 1.15, duck: 1.1, pull: .5 } },
  philly: { label: 'Philly shell', desc: 'Lead arm across the belly, chin behind the shoulder. Rolls straights off the shoulder and fires back. Takes real reflexes and ring smarts.',
    head: 1, body: 1.05, str: 1.12, hook: .8, up: .85, ev: 1, ctr: 1.05, hold: .85, skill: ['defense', 'speed', 'accuracy'], def: { block: .5, slip: 1, duck: .7, pull: 1.1, roll: 1.25 } },
  cross: { label: 'Cross-arm', desc: 'Forearms locked across the face. Built for head shots and uppercuts. The ribs and liver hang out.',
    head: 1.2, body: .66, str: 1.08, hook: 1.05, up: 1.45, ev: .8, ctr: .9, hold: 1.35, def: { block: 2.2, slip: .5, duck: .6, pull: .6 } },
  handslow: { label: 'Hands low', desc: 'Gloves at the waist, eyes wide open. Sees everything and fires back, but pays for it when the legs go.',
    head: .75, body: .9, str: .9, hook: .85, up: 1, ev: 1.3, ctr: 1.3, hold: .7, skill: ['defense', 'footwork', 'speed'], def: { block: .4, slip: 1.3, duck: .9, pull: 2 } }
};
// what a smart opponent throws into each guard
const GUARD_HOLES = {
  standard: {},
  high: { bodyJab: 1.5, bodyHook: 1.7, uppercut: 1.35, jab: .8, cross: .85, hook: .9 },
  peekaboo: { jab: 1.3, bodyJab: 1.25, bodyHook: 1.15, hook: .85, uppercut: .85 },
  philly: { cross: 1.55, hook: .8, jab: .7, bodyJab: .75, bodyHook: 1.1, uppercut: 1.15 },
  cross: { bodyHook: 1.7, bodyJab: 1.45, hook: 1.15, cross: .75, jab: .8, uppercut: .6 },
  handslow: { jab: 1.3, cross: 1.2, hook: 1.1, bodyJab: .9 }
};
const GUARD_FEINT = { philly: 1.7, handslow: 1.6, peekaboo: 1.2 }; // counter-happy guards bite on feints
const STYLE_GUARDS = {
  outboxer: { standard: 3, handslow: 2, philly: 1.2, high: .6 },
  slugger: { standard: 2, high: 2, cross: 1.4, peekaboo: .6 },
  swarmer: { peekaboo: 2.4, high: 2, standard: 1, cross: .8 },
  counter: { philly: 2.6, standard: 1.4, handslow: 1.2, high: .8 },
  boxerpuncher: { standard: 3, high: 1.4, philly: 1, peekaboo: .6, handslow: .4 }
};
// a fighter still learning a style fights as a blend of the old one and the new one
const STYLE_DEF = { legs: 1, hit: 1, ret: .7 };
function blendStyle(sh) {
  const to = STYLES[sh.style] || STYLES.boxerpuncher, from = sh.styleFrom && STYLES[sh.styleFrom], f = sh.styleFit == null ? 1 : clamp(sh.styleFit, 0, 1);
  if (!from || f >= 1) return to;
  const o = { label: to.label };
  for (const k of new Set([...Object.keys(to), ...Object.keys(from)])) {
    if (k === 'label' || k === 'bias' || k === 'desc') continue;
    const d = STYLE_DEF[k] || 0; o[k] = lerp(from[k] != null ? from[k] : d, to[k] != null ? to[k] : d, f);
  }
  return o;
}
function domStyle(sh) { return sh.styleFrom && STYLES[sh.styleFrom] && (sh.styleFit == null ? 1 : sh.styleFit) < .5 ? sh.styleFrom : sh.style; }
function comboW(F, c) { const sh = F.sheet, f = sh.styleFit == null ? 1 : sh.styleFit; return sh.styleFrom && f < 1 ? lerp(c.w[sh.styleFrom] || 0, c.w[sh.style] || 0, f) : c.w[sh.style] || 0; }
Object.assign(STYLE_GUARDS, {
  volume: { peekaboo: 2, high: 1.5, standard: 1 }, angle: { handslow: 2, standard: 2 }, awkward: { handslow: 3, philly: 1 },
  switch: { standard: 2, philly: 1 }, body: { high: 2, peekaboo: 1.5 }, pboxer: { high: 2.5, standard: 1 },
  spoiler: { philly: 2, high: 1.5 }, jabgrab: { standard: 2, high: 1 }, feinter: { standard: 2, handslow: 1 }
});
function rollGuard(style) { const w = STYLE_GUARDS[style] || { standard: 1 }; return wpick(Object.keys(w), k => w[k]); }
// how well his stats support the guard: 0 = can't make it work, 1 = fully
function guardSkill(stats, g) { const G = GUARDS[g] || GUARDS.standard; if (!G.skill) return 1; const v = G.skill.reduce((s, k) => s + stats[k], 0) / G.skill.length; return clamp((v - 50) / 32, 0, 1); }
// ring IQ: technique stats plus experience. Not trained directly, it grows with fights
function ringIQ(sh) {
  const s = sh.stats, exp = sh.exp || 0;
  return clamp(s.accuracy * .3 + s.defense * .3 + s.footwork * .25 + s.heart * .15 - 6 + Math.min(16, Math.sqrt(exp) * 3.2), 20, 99);
}

/* ---------- combo library. r: working range (L long, M mid, I inside). w: how much each style likes it ---------- */
const COMBOS = [
  ['jab', 'L', { outboxer: 3, counter: 2, boxerpuncher: 2, slugger: 1, swarmer: .6 }],
  ['jab,jab', 'L', { outboxer: 2.4, boxerpuncher: 1.3, counter: 1, slugger: .5, swarmer: .5 }],
  ['jab,cross', 'L', { outboxer: 2.2, boxerpuncher: 2.2, counter: 1.6, slugger: 1.4, swarmer: .9 }],
  ['jab,jab,cross', 'L', { outboxer: 1.4, boxerpuncher: 1.2, counter: .7, slugger: .6, swarmer: .5 }],
  ['cross', 'L', { counter: 1.6, slugger: 1.4, boxerpuncher: .9, outboxer: .8, swarmer: .4 }],
  ['bodyJab', 'L', { outboxer: .9, counter: 1, boxerpuncher: .7, slugger: .4, swarmer: .5 }],
  ['bodyJab,jab', 'L', { outboxer: 1, boxerpuncher: .8, counter: .7, slugger: .3, swarmer: .4 }],
  ['jab,bodyJab', 'L', { outboxer: .7, boxerpuncher: .6, counter: .5, swarmer: .4, slugger: .3 }],
  ['bodyJab,cross', 'L', { boxerpuncher: 1, outboxer: .8, counter: .8, slugger: .7, swarmer: .4 }],
  ['jab,cross,hook', 'M', { boxerpuncher: 1.6, outboxer: .8, slugger: 1, swarmer: 1.2, counter: .7 }],
  ['jab,jab,cross,hook', 'M', { boxerpuncher: .8, outboxer: .5, swarmer: .6, slugger: .4, counter: .3 }],
  ['jab,hook', 'M', { boxerpuncher: .8, slugger: .8, swarmer: .7, counter: .6, outboxer: .5 }],
  ['cross,hook', 'M', { slugger: 2, boxerpuncher: 1.2, swarmer: 1, counter: 1, outboxer: .5 }],
  ['cross,hook,cross', 'M', { slugger: 1, boxerpuncher: .9, swarmer: .8, counter: .4, outboxer: .3 }],
  ['jab,cross,bodyHook', 'M', { boxerpuncher: 1, swarmer: 1, slugger: .8, outboxer: .4, counter: .4 }],
  ['jab,bodyHook,hook', 'M', { swarmer: 1.4, boxerpuncher: .9, slugger: .8, outboxer: .3, counter: .3 }],
  ['cross,bodyHook', 'M', { slugger: .9, boxerpuncher: .8, swarmer: .8, counter: .5 }],
  ['hook', 'I', { slugger: 2, swarmer: 1.2, counter: 1.2, boxerpuncher: .8, outboxer: .3 }],
  ['bodyHook,hook', 'I', { swarmer: 2, slugger: 1.2, boxerpuncher: .9, counter: .4, outboxer: .2 }],
  ['hook,hook', 'I', { swarmer: 1.4, slugger: .9, boxerpuncher: .5 }],
  ['hook,uppercut', 'I', { slugger: 1, swarmer: 1, boxerpuncher: .9, counter: .5 }],
  ['uppercut,hook', 'I', { slugger: 1.4, swarmer: 1.3, boxerpuncher: .8, counter: .6 }],
  ['bodyHook,bodyHook,uppercut', 'I', { swarmer: 1, slugger: .5, boxerpuncher: .3 }],
  ['uppercut,cross', 'I', { boxerpuncher: .7, slugger: .7, counter: .5, swarmer: .6 }],
  ['hook,cross,hook', 'I', { swarmer: .9, slugger: .8, boxerpuncher: .6 }],
  ['bodyHook,uppercut,hook', 'I', { swarmer: .9, slugger: .6, boxerpuncher: .4 }],
  ['uppercut', 'I', { counter: .8, slugger: .6, swarmer: .5, boxerpuncher: .4 }],
  ['bodyHook', 'I', { swarmer: .9, slugger: .7, boxerpuncher: .6, counter: .5, outboxer: .3 }]
].map(([s, r, w]) => { const seq = s.split(','); return { key: s, seq, r, w, len: seq.length, body: seq.filter(p => PUNCH[p].zone === 'body').length, pow: seq.filter(p => PUNCH[p].cat === 'power').length }; });
const RANGE_C = { L: [70, 14], M: [56, 12], I: [41, 12] };
// special styles borrow a base style's combo menu and lean it: longer combos, more body, more jabs, more power
const STYLE_COMBO = {
  volume: { from: 'boxerpuncher', len: 1.35, jab: 1.1, pow: .95 }, angle: { from: 'boxerpuncher' }, awkward: { from: 'counter', pow: 1.15 },

function genOffers(save) {

function worldSim(save, weeks) {

    }
