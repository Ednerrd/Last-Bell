<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7dfd0" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#15110e" media="(prefers-color-scheme: dark)">
<title>Last Bell</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e7dfd0;--panel:#f2ebdf;--panel2:#dcd2c0;--ink:#1e1712;--mute:#6c5f51;--line:rgba(30,23,18,.14);--accent:#b06d17;--accent-ink:#fff8ec;--red:#9b2320;--blue:#3f6987;--good:#3d7a4a;--stitch:rgba(176,109,23,.35);--bar:#2a211a;
--disp:'Anton',Impact,'Arial Narrow Bold',sans-serif;--ui:'Barlow Condensed','Arial Narrow',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15110e;--panel:#211913;--panel2:#2e241c;--ink:#ece4d6;--mute:#a09280;--line:rgba(236,228,214,.12);--accent:#f0b85a;--accent-ink:#1a120a;--red:#c8392f;--blue:#6b9bc0;--good:#74b383;--stitch:rgba(240,184,90,.28);--bar:#0d0a08}}
:root[data-theme="dark"]{--bg:#15110e;--panel:#211913;--panel2:#2e241c;--ink:#ece4d6;--mute:#a09280;--line:rgba(236,228,214,.12);--accent:#f0b85a;--accent-ink:#1a120a;--red:#c8392f;--blue:#6b9bc0;--good:#74b383;--stitch:rgba(240,184,90,.28);--bar:#0d0a08}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.35 var(--ui);-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:12px 14px 40px}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:.01em;margin:0;line-height:1.05}
h4{font-family:var(--disp);font-weight:400;font-size:19px;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
p{margin:6px 0}
.mute{color:var(--mute)} .small{font-size:15px}
.row{display:flex;gap:10px;margin:10px 0}.row>*{flex:1}.row.center{justify-content:center}.row.center>*{flex:0 0 auto}
.btn{display:block;width:100%;border:0;border-radius:4px;padding:13px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;letter-spacing:.02em}
.btn.big{padding:16px;font-size:20px;margin:12px 0}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.hot{background:var(--red);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:8px 12px;font-size:16px;width:auto}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:10px}
.topbar>:last-child{justify-self:end}.tb-title{font-family:var(--disp);font-size:19px}.cash{font-weight:700;color:var(--good)}
.seg{display:flex;background:var(--panel2);border-radius:5px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:3px;font-weight:600}
.seg button.on{background:var(--panel);box-shadow:0 1px 0 var(--line);color:var(--accent)}
.seg.small button{padding:6px 10px}
.chips{display:flex;gap:6px;align-items:center}.chips.wrap{flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-weight:600}
.chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chip.sug:not(.on){border-style:dashed;border-color:var(--accent)}
.tog{border:1.5px solid var(--line);background:transparent;border-radius:4px;padding:6px 12px;font-weight:600;color:var(--mute)}
.tog.on{color:var(--ink);border-color:var(--accent)}
.belt{display:inline-block;font-family:var(--disp);font-size:12px;padding:1px 6px;border-radius:2px;background:var(--bc);color:#fff;letter-spacing:.04em;vertical-align:middle}
.stitched{position:relative;background:var(--panel);border-radius:6px}
.stitched:after{content:'';position:absolute;inset:5px;border:1px dashed var(--stitch);border-radius:4px;pointer-events:none}
/* title */
.title-wrap{min-height:88vh;display:flex;flex-direction:column;justify-content:center}
.marquee{text-align:center;padding:30px 10px 26px;position:relative}
.marquee .bulb{width:14px;height:14px;border-radius:50%;margin:0 auto 18px;background:#ffd58a;box-shadow:0 0 30px 12px rgba(240,184,90,.45),0 0 90px 40px rgba(240,184,90,.18)}
.marquee h1{font-size:clamp(64px,19vw,104px);text-transform:uppercase;line-height:.9;letter-spacing:.02em}
.marquee p{color:var(--mute);max-width:30ch;margin:14px auto 0;font-size:18px}
.slots{display:grid;gap:10px;margin:18px 0}
.slot{display:flex;align-items:stretch;background:var(--panel);border-radius:6px;border:1.5px solid var(--line);overflow:hidden}
.slot.empty{flex-direction:column;align-items:flex-start;padding:14px 16px;border-style:dashed;background:transparent;text-align:left}
.slot-main{flex:1;text-align:left;background:none;border:0;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.sn{font-family:var(--disp);font-size:22px}.st{color:var(--mute)}
.slot .x{background:none;border:0;border-left:1px solid var(--line);color:var(--mute);padding:0 14px;font-size:14px}
.code{width:100%;min-height:120px;font:13px/1.35 ui-monospace,Menlo,monospace;word-break:break-all;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:4px;padding:9px 10px;margin:10px 0;resize:vertical}
/* create / hub */
.create-top,.poster{display:flex;gap:14px;align-items:center;padding:14px}
.create-top{padding:6px 0}
.portrait{width:120px;height:150px;flex:0 0 auto;border-radius:4px;background:radial-gradient(ellipse at 50% 30%,#3a2a1c,#120d0a);display:block}
.portrait.wide{width:100%;height:190px}.portrait.sm{width:76px;height:96px}
.ct-info{flex:1;display:flex;flex-direction:column;gap:8px}
label{display:flex;flex-direction:column;font-size:14px;color:var(--mute);gap:3px}
input,select{background:var(--panel);border:1.5px solid var(--line);border-radius:4px;padding:9px 10px;font-size:17px;width:100%}
.mini b{font-family:var(--disp);font-size:20px;font-weight:400;color:var(--accent)}
.swatches{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pts{font-family:var(--ui);font-size:15px;color:var(--accent);font-weight:700}.pts.done{color:var(--good)}
.stats{display:grid;gap:7px}
.stat{display:grid;grid-template-columns:7.2em 1fr 2em auto;gap:8px;align-items:center;font-size:16px}
.stat.alloc{grid-template-columns:7.2em 34px 1fr 34px 2em}
.bar{position:relative;height:9px;background:var(--panel2);border-radius:5px;overflow:visible;display:block}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:5px}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
.bar.warn i{background:var(--red)}
.sv{font-weight:700;text-align:right}
.delta{font-size:14px;font-weight:700}.delta.up,.up{color:var(--good)}.delta.down,.down{color:var(--red)}
.pm{width:34px;height:30px;border-radius:4px;border:1.5px solid var(--line);background:var(--panel);font-weight:700;font-size:18px;padding:0}
.poster h2{font-size:34px;text-transform:uppercase}
.poster .nick{color:var(--accent);font-weight:600}
.pinfo{flex:1;min-width:0}
.recbig{font-family:var(--disp);font-size:28px;margin:2px 0}.recbig small{font-family:var(--ui);font-size:16px;color:var(--mute)}
.poster.col{flex-direction:column;text-align:center}
.alert{background:color-mix(in srgb,var(--red) 14%,transparent);border-left:3px solid var(--red);padding:9px 12px;border-radius:3px;margin:10px 0}
.alert.gold{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:var(--accent)}
.wear{display:grid;grid-template-columns:auto 1fr 2em;gap:10px;align-items:center;margin:14px 0 4px;font-size:15px;color:var(--mute)}
.tabs{display:flex;border-bottom:1.5px solid var(--line);margin-top:20px}
.tabs button{flex:1;background:none;border:0;padding:10px 4px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.tabbody{padding-top:8px}
.gcard{border:1.5px solid var(--line);border-radius:4px;padding:10px 12px;margin:10px 0}.gcard .gtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.gcard .gtop>b{font-family:var(--disp);font-weight:400;font-size:20px;letter-spacing:.02em}.gcard .gtop span b{font-family:var(--disp);font-weight:400;font-size:20px;color:var(--accent)}.gcard p{margin:6px 0}.tiny{font-size:13px}.alert.small{font-size:14px}
.ovr{margin:8px 0 12px}.ovr b{font-family:var(--disp);font-size:30px;font-weight:400;color:var(--accent);margin:0 6px}
.rklist{display:grid}
.rk{display:grid;grid-template-columns:2em 1fr auto 2.6em;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);align-items:center;font-size:16px}
.rk.head{color:var(--mute);font-size:14px}.rk.me{background:color-mix(in srgb,var(--accent) 14%,transparent);font-weight:700}
.rk .n{color:var(--mute)}.rk .ov{text-align:right;font-weight:700}.rk.gap{display:block;text-align:center;color:var(--mute)}
.rk .rc{color:var(--mute);font-size:15px}
.champs{display:grid;gap:6px}.champ{display:flex;gap:10px;align-items:center}
.gear{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gi{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px;border-radius:5px;border:1.5px solid var(--line);background:var(--panel);text-align:left}
.gi.on{border-color:var(--accent)}.gi small{color:var(--mute)}.gi:disabled{opacity:.45}
.gsw{width:100%;height:18px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.hist{display:grid}.hr{display:grid;grid-template-columns:2em 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.hr .res{font-family:var(--disp);font-size:22px}.hr.W .res{color:var(--good)}.hr.L .res{color:var(--red)}.hr.D .res{color:var(--mute)}
.hr small{color:var(--mute)}.hp{text-align:right;font-weight:600}
/* gym */
.gymhead{padding:16px}.gymhead h2{font-size:30px;text-transform:uppercase}
.gf{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;padding:10px 12px;margin:8px 0;color:inherit}
.gfi{display:flex;flex-direction:column;gap:2px;min-width:0}.gfi b{font-family:var(--disp);font-weight:400;font-size:20px}
.gst{font-size:15px;color:var(--accent);font-weight:600}.gst.hot{color:var(--red)}
.wk{padding:12px 14px;margin:8px 0}.wk .gtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.wk .gtop b{font-family:var(--disp);font-weight:400;font-size:20px}.wk p{margin:4px 0}.wk .of{margin-top:6px;padding-top:8px}
/* offers / camp */
.offer{padding:16px;margin:12px 0}.offer.title-fight{box-shadow:0 0 0 2px var(--accent)}
.ol{color:var(--accent);font-weight:700;margin-bottom:8px}
.om{display:flex;gap:12px;align-items:center}.om h3{font-size:24px;text-transform:uppercase}
.read{font-size:15px;margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:3px}.read b{color:var(--accent)}
.tape{margin:10px 0 0}.tape summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:15px;padding:4px 0;list-style:none}.tape summary::-webkit-details-marker{display:none}.tape summary:before{content:'▸ ';}.tape[open] summary:before{content:'▾ '}
.tt{display:grid;grid-template-columns:1.6em 1fr max-content 1fr 1.6em;gap:3px 6px;align-items:center;font-size:14px;margin-top:6px}.tt .h{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.tt .l{text-align:center;color:var(--mute);white-space:nowrap;font-size:13px}.tt .v{text-align:center;font-variant-numeric:tabular-nums}.tt .v.w{font-weight:700;color:var(--ink)}.tt .v:not(.w){color:var(--mute)}
.tt .pv{grid-column:span 2;font-variant-numeric:tabular-nums}.tt .pv.me{text-align:right}.tt .pv.him{text-align:left}.tt .pv small{color:var(--mute)}.tt .q{color:var(--mute);letter-spacing:.05em}.tt .b.unk{background:repeating-linear-gradient(90deg,var(--panel2) 0 4px,transparent 4px 8px)}
.resume{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}.resume h5{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:0 0 4px}.resume ul{margin:0 0 6px;padding-left:18px;font-size:15px}.resume li.you{color:var(--red)}.resume p{margin:4px 0}
.scout{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.tt .b{height:7px;background:var(--panel2);border-radius:2px;position:relative;overflow:hidden}.tt .b i{position:absolute;top:0;bottom:0;border-radius:2px}.tt .b.me i{right:0;background:var(--blue)}.tt .b.him i{left:0;background:var(--red)}
.of{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.of .btn{width:auto;padding:11px 26px}.purse{font-family:var(--disp);font-size:26px;display:block;color:var(--good)}.of small{color:var(--mute)}
.opts{display:grid;gap:8px}.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;padding:11px 12px;border-radius:5px;border:1.5px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:2px}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.opt span{color:var(--good);font-weight:600}.opt small{color:var(--mute);font-size:14px}
.opt:disabled{opacity:.4}
.sumbar{display:flex;justify-content:space-between;margin-top:18px;padding:12px 0;border-top:1.5px solid var(--line)}.neg{color:var(--red)}
/* fight */
#app.fightmode{padding:6px 8px 20px;max-width:640px}
.fight{display:flex;flex-direction:column;gap:6px}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;background:#0e0a08;color:#ece4d6;padding:8px 10px;border-radius:5px}
.hn{font-family:var(--disp);font-size:16px;text-transform:uppercase;letter-spacing:.03em}
.hf.r{text-align:right}
.hb{position:relative;height:10px;background:#3a0c0c;border-radius:2px;overflow:hidden;margin-top:3px}
.hb .max{position:absolute;top:0;bottom:0;left:0;background:#5a1715}
.hb .cur{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(#e0473a,#a3201f);transition:width .12s}
.sb{position:relative;height:5px;margin-top:3px;display:flex;gap:3px}
.sb i{display:block;height:5px;background:#d3893a;border-radius:2px;transition:width .2s}.sb .st{background:#e6cf7a}
.hf.r .hb .max,.hf.r .hb .cur{left:auto;right:0}.hf.r .sb{justify-content:flex-end}
.clock{text-align:center;min-width:64px}.clock span{display:block;font-size:13px;color:#a09280}.clock b{font-family:var(--disp);font-size:26px;font-weight:400;line-height:1}
.stage{position:relative;border-radius:5px;overflow:hidden;background:#000;aspect-ratio:4/3}
.stage canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s;color:#f4ecdf;text-align:center}
.ov.show{opacity:1}.ov.show .corner,.ov.show .corner *{pointer-events:auto}
.ov .big{font-family:var(--disp);font-size:clamp(48px,15vw,88px);text-transform:uppercase;color:#f0b85a;text-shadow:0 4px 0 #3a0c0c,0 0 40px rgba(0,0,0,.8);line-height:1}
.ov .sub{font-size:18px;font-weight:600;text-shadow:0 2px 6px #000;margin-top:6px}
.ov .count{font-family:var(--disp);font-size:clamp(80px,26vw,150px);color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.6);animation:cnt .8s ease-out}
.ov .count.small{font-size:34px;animation:none}
@keyframes cnt{0%{transform:scale(1.5);opacity:0}25%{transform:scale(1);opacity:1}100%{opacity:.75}}
.ov .replay-tag small{font-family:var(--ui);font-size:12px;color:#cfc4ad;letter-spacing:0;margin-left:6px}.ov .replay-tag{position:absolute;top:5px;left:12px;font-family:var(--disp);font-size:16px;color:#f0b85a;letter-spacing:.08em}
.intro{background:rgba(10,7,5,.72);padding:16px 22px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.intro b{font-family:var(--disp);font-size:clamp(24px,7vw,36px);font-weight:400;text-transform:uppercase;line-height:1}
.intro em{font-family:var(--disp);font-style:normal;color:#f0b85a;font-size:18px}.intro span{font-size:14px;color:#cfc4ad}
.cornerbox{display:none}.cornerbox.show{display:block}.corner{background:#0e0a08;color:#ece4d6;border-radius:5px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left}
.corner .ch{font-family:var(--disp);font-size:20px;color:#f0b85a}
.cst{display:grid;grid-template-columns:1fr 3.5em 3.5em;gap:2px 8px;font-size:15px}.cst b{text-align:right}.cst span{color:#a09280}
.corner .cut{color:#cfc4ad;font-size:15px;margin:0}.corner .pv{margin:0;font-size:15px;padding-left:8px;border-left:3px solid #a09280}.corner .pv.ok{border-color:#6fbf73}.corner .pv.no{border-color:#d9644a}.corner .adv{margin:0;font-size:16px}
.corner .notes{margin:0;padding-left:18px;font-size:14px;color:#cfc4ad}.corner .notes li{margin:1px 0}
.corner .talk{display:flex;gap:6px}.corner .talk input{flex:1;min-width:0;background:#1c1510;color:#ece4d6;border:1px solid rgba(236,228,214,.3);border-radius:4px;padding:8px;font:inherit;font-size:16px}
.corner .say{margin:0;font-size:16px}.corner .say b{color:#f0b85a}.corner .plan{margin:0;font-size:14px;color:#a09280}.corner .mute{opacity:.7}
.corner .chip{color:#ece4d6;border-color:rgba(236,228,214,.25);padding:5px 10px;font-size:15px}
.corner .chip.on{color:#f0b85a;border-color:#f0b85a}.corner .chip.sug:not(.on){border-color:#f0b85a}
.corner .btn{background:#f0b85a;color:#1a120a;padding:10px}
.ctimer{height:3px;background:rgba(255,255,255,.1)}.ctimer i{display:block;height:3px;background:#f0b85a;width:100%}
.pop{position:absolute;left:10px;right:10px;bottom:30px;text-align:center;color:#f4ecdf;font-style:italic;font-size:16px;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .3s;pointer-events:none}
.pop.show{opacity:1}
.yell{position:absolute;left:10px;top:10px;max-width:70%;background:#f0b85a;color:#1a120a;font-family:var(--disp);font-size:clamp(18px,5.5vw,26px);text-transform:uppercase;line-height:1.05;padding:6px 10px;border-radius:4px;box-shadow:0 3px 0 #3a0c0c;opacity:0;transform:scale(.85) rotate(-2deg);transition:opacity .15s,transform .15s;pointer-events:none}
.yell::after{content:'';position:absolute;left:14px;bottom:-8px;border:8px solid transparent;border-top-color:#f0b85a;border-bottom:0}
.yell.show{opacity:1;transform:scale(1) rotate(-2deg)}
.shouts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;transition:opacity .2s}.shouts.off{opacity:.4;pointer-events:none}
.shouts button{position:relative;overflow:hidden;border:1.5px solid rgba(236,228,214,.2);background:#0e0a08;color:#ece4d6;border-radius:5px;padding:10px 4px;font-weight:700;font-size:15px;letter-spacing:.02em;touch-action:manipulation}
.shouts button:active{transform:scale(.96)}
.shouts button.on{border-color:#f0b85a;color:#f0b85a}
.shouts button i{position:absolute;left:0;bottom:0;height:3px;width:0;background:#7d7264}.shouts button.good i{background:#74b383}
.feed{min-height:76px;background:#0e0a08;color:#cfc4ad;border-radius:5px;padding:7px 11px;font-size:16px}

 * @typedef {Object} Perception

 */
/**
 * What's on screen about the other man (the eyes, E1: the truth; his eyes decide what he notices). All 0..1, optional: a host without one leaves it out.
 * @typedef {Object} Look

 */
/**
 * A punch in the air, as it truly is (his eyes add the error).
 * @typedef {Object} SeenPunch
 * @property {number} id
 * @property {string} type       PUNCHES key
 * @property {number} t          seconds since it started
 * @property {number} impactIn   seconds until it lands (99 for a feint)
 * @property {boolean} feint
 * @property {number} sell       how real the feint looks
 * @property {?string} look      a changed ending (traps)
 * @property {number} tell       how much it was telegraphed
 * @property {number} [blind]    how shut his own eye is on the side it comes in on (0 open .. 1 shut: he can't see it coming)
 */
/**
 * What he decides each frame (think()). The game turns it into feet, hands and a guard.
 * @typedef {Object} Action
 * @property {string} intent     his mode: feelout, work, pressure, hunt, survive, down...
 * @property {{ range: number, lateral: number, cut: number, clinch: boolean }} move
 * @property {number} guard      0..1 how high and tight the hands are

 * @property {?Object} punch     { type, combo, counter, feint, tech, commit, tell, ... } or null

 */
/**
 * @typedef {Object} BrainOpts

/* ---------- the punches (same names and numbers as the engine) ---------- */

  offense: ['jab', 'power', 'combos', 'body', 'feints'],
  defense: ['block', 'slip', 'footwork', 'clinch'],
  ringcraft: ['cutoff', 'ropes', 'range', 'angles'],

  { key: 'novice', label: 'Novice', min: 0, center: 34 },
  { key: 'intermediate', label: 'Intermediate', min: 46, center: 56 },

   lead/ctr: initiative (1 starts it, 0 waits to make you pay), patience (waits for the right shot)
   defense:  shell (gloves and arms), slip (head movement), legs (gets out of range), clinch (ties up)

// a level table read at mastery m (0..1): straight lines between the tier centers, flat past the ends
function tierV(m, t) { if (m <= TIER_C[0]) return t[0]; for (let i = 1; i < 4; i++) if (m <= TIER_C[i]) return lerp(t[i - 1], t[i], (m - TIER_C[i - 1]) / (TIER_C[i] - TIER_C[i - 1])); return t[3]; }
// a curve through [x, y] points, flat past the ends
function ptsV(x, P) { if (x <= P[0][0]) return P[0][1]; for (let i = 1; i < P.length; i++) if (x <= P[i][0]) return lerp(P[i - 1][1], P[i][1], (x - P[i - 1][0]) / (P[i][0] - P[i - 1][0])); return P[P.length - 1][1]; }

function lvV(key, m) { const on = BR.lv.on[key] || 0, v = tierV(m, BR.lv[key]); return on === 1 ? v : lerp(key === 'off' || key === 'late' || key === 'flinch' || key === 'tell' || key === 'freeze' ? 0 : key === 'len' ? 9 : 1, v, on); }

  overlay(`<div class="intro"><span>${esc(DIVS[L.div].name)}</span><b>${esc(A.name)}</b><em>vs</em><b>${esc(B.name)}</b><span>${o.rounds} rounds, ${esc(VENUE_NAMES[o.venue])}</span><span>Referee ${esc(F.ref.name)}</span></div>`, 2300);
  feed(`Referee ${F.ref.name}: ${F.ref.style}. Judges: ${F.judges.map(j => `${j.name} (${j.taste})`).join(', ')}.`);

function labBar(L) {

ACT.labNew = () => labNew(false);

// the result: who won and how, the punch stats, then go again
// L4f: what he takes from this one (docs/LEARN.md 7). The lab doesn't keep fighters, so this is the read on a copy of his sheet: the biggest gains, a level up,
// the answer to what beat him, a new style seen, a scar, the man he'll remember
const LEARN_LINE = { jab: 'His jab is getting sharper.', power: "He's sitting down on his power shots more.", combos: 'His combinations are flowing better.', body: "He's learning to dig to the body.",
  feints: "He's selling his feints better.", block: 'His guard is getting tighter.', slip: "He's slipping shots he used to eat.", footwork: 'His feet are getting him out of trouble quicker.',
  clinch: "He's learning to tie up when it gets hot.", cutoff: "He's cutting off the ring better.", ropes: "He's getting off the ropes faster.", range: "He's finding his range.",
  angles: "He's taking better angles.", counter: 'His counters are coming quicker.', read: "He's reading what's coming.", pacing: "He's learning to pace himself.", adjust: "He's adjusting quicker between rounds." };
function learnedLines() {
  try {
    const me = JSON.parse(JSON.stringify(F.f[0].sheet)), lines = [];
    learnInit(me); const before = JSON.parse(JSON.stringify(me)), d = learn(me, F, 0), O = F.f[1], K = BoxerBrain.SKILL_KEYS;
    for (const [k, t] of d.cross) lines.push(`Level up: his ${k} is ${BoxerBrain.TIERS.find(x => x.key === t).label} now.`);
    K.filter(k => d.sk[k] > .3 && !d.cross.some(c => c[0] === k)).sort((a, b) => d.sk[b] - d.sk[a]).slice(0, 2).forEach(k => lines.push(LEARN_LINE[k]));
    const top = d.rep.won < 0 && (d.rep.beat.kd[0] || d.rep.beat.hurt[0]); if (top) lines.push(`He'll see that ${pName(top[0])} coming next time.`);
    const st = domStyle(O.sheet); if ((d.know.style[st] || 0) - (before.know.style[st] || 0) > .05 && (before.know.style[st] || 0) < .5) { const lb = STYLES[st].label.toLowerCase(); lines.push(`He's seen ${/^[aeiou]/.test(lb) ? 'an' : 'a'} ${lb} up close now.`); }
    if (d.scar && d.scar.n === 0) lines.push(d.scar.kind === 'gunShy' ? 'That knockout shook him. He might hesitate to let his hands go for a while.' : "That knockout's still in his head. He'll be careful for a fight or two.");
    lines.push(`He'll remember ${O.sheet.name}.`);
    return lines.slice(0, 5);
  } catch (e) { return []; }
}
function resultScreen() {
  if (!F || !F.result) return;
  Comm.stop();
  const res = F.result, A = F.f[0], B = F.f[1], L = LAB.last;
  const mName = { UD: 'Unanimous decision', SD: 'Split decision', MD: 'Majority decision' }[res.method] || res.method;
  const how = res.decision ? mName : `${mName}, round ${res.round} at ${res.time}`;
  const who = res.winner == null ? 'Draw' : esc([L.A, L.B][res.winner].name) + ' wins';
  const row = (l, k) => `<div class="pr"><b>${A.tot.landed[k]}/${A.tot.thrown[k]}</b><span>${l}</span><b>${B.tot.landed[k]}/${B.tot.thrown[k]}</b></div>`;
  const keys = Object.keys(A.tot.landed);
  show(`<div class="screen">${labBar(L)}<h2>${who}</h2><p class="mute">${esc(how)}</p>
    <div class="cards">${res.cards.map((c, i) => `<div><span>${esc(F.judges[i].name)}</span><b>${c[0]}-${c[1]}</b><small>${esc(F.judges[i].taste)}</small></div>`).join('')}</div>
    <p class="mute small">Referee ${esc(F.ref.name)}, ${esc(F.ref.style)}</p>
    <div class="pstats">${keys.map(k => row(k[0].toUpperCase() + k.slice(1), k)).join('')}</div>
    ${(() => { const ln = learnedLines(); return ln.length ? `<div class="learned"><h3>What ${esc(L.A.name)} takes from this one</h3><ul>${ln.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''; })()}</div>`, '');
}
